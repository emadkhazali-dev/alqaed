<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام القائد | AlQaed Dashboard</title>
    <style>
        :root { --navy: #001f3f; --gold: #D4AF37; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; }
        header { background: var(--navy); color: var(--gold); padding: 15px 30px; border-bottom: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .stats-bar { background: var(--gold); color: var(--navy); padding: 12px; display: flex; justify-content: space-around; font-weight: bold; font-size: 18px; }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 15px; }
        .search-box { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid var(--navy); border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--navy); color: var(--gold); padding: 12px; text-align: right; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: right; }
        .btn-wa { background: #25D366; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; }
        .val-total { color: #cc0000; font-weight: bold; }
        .val-blue { color: #0056b3; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">AlQaed Dashboard | إدارة أبو خالد</h1>
    <button onclick="fetchData()" style="padding:10px 20px; cursor:pointer; background:var(--gold); border:none; font-weight:bold; border-radius:5px;">تحديث البيانات 🔄</button>
</header>

<div class="stats-bar">
    <div id="total-debt">إجمالي المديونية الكلية: 0 دينار</div>
    <div id="captain-count">عدد الكباتن: 0</div>
</div>

<div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن اسم كابتن..." onkeyup="filterTable()">
    
    <div class="card">
        <table id="captainsTable">
            <thead>
                <tr>
                    <th>المستهلك</th>
                    <th>المنتج</th>
                    <th>نص الطلب</th>
                    <th>الأجرة (Agra)</th>
                    <th>عمولة المنتج (15%)</th>
                    <th>المديونية الكلية</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="8" style="text-align:center;">جاري جلب البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // استبدل الرابط أدناه بالرابط الجديد من الـ New Deployment
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzC6jl5Mc2E6QIrxp0khUneVE9R0HsDDtVFLiKQR5e2OHB0cbtZBxctfcjEGCCtOzrc/exec";

    async function fetchData() {
        const tbody = document.getElementById('table-body');
        try {
            const response = await fetch(SCRIPT_URL + '?nocache=' + new Date().getTime());
            const data = await response.json();
            tbody.innerHTML = "";
            let totalSum = 0;

            data.forEach(row => {
                const agra = parseFloat(row.agra) || 0;
                const pComm = parseFloat(row.commProduct) || 0;
                const grandTotal = agra + pComm;
                totalSum += grandTotal;
                
                const msg = `شركة القائد:\nكابتن ${row.name}\nالأجرة: ${agra}\nعمولة المنتج: ${pComm.toFixed(2)}\nالمجموع: ${grandTotal.toFixed(2)} دينار.`;
                const waLink = `https://wa.me/${row.phone}?text=${encodeURIComponent(msg)}`;
                
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${row.name}</strong></td>
                        <td>${row.product || '-'}</td>
                        <td><small>${row.details || '-'}</small></td>
                        <td>JOD ${agra.toFixed(2)}</td>
                        <td class="val-blue">${pComm.toFixed(2)}</td>
                        <td class="val-total">${grandTotal.toFixed(2)} دينار</td>
                        <td>${row.status || 'نشط'}</td>
                        <td><a href="${waLink}" target="_blank" class="btn-wa">تنبيه واتساب ✅</a></td>
                    </tr>
                `;
            });

            document.getElementById('total-debt').innerText = `إجمالي المديونية الكلية: ${totalSum.toFixed(2)} دينار`;
            document.getElementById('captain-count').innerText = `عدد الكباتن: ${data.length}`;
        } catch (e) { tbody.innerHTML = "خطأ في الاتصال بالبيانات"; }
    }

    function filterTable() {
        let input = document.getElementById("searchInput");
        let filter = input.value.toUpperCase();
        let tr = document.getElementById("captainsTable").getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            let td = tr[i].getElementsByTagName("td")[0];
            if (td) {
                tr[i].style.display = (td.textContent || td.innerText).toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    }
    window.onload = fetchData;
</script>
</body>
</html>
