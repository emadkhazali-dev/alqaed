<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlQaed Dashboard | نظام القائد الذكي</title>
    <style>
        :root { --navy: #001f3f; --gold: #D4AF37; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; }
        header { background: var(--navy); color: var(--gold); padding: 20px; border-bottom: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--white); border-radius: 12px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--navy); color: var(--gold); padding: 15px; text-align: right; }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: right; }
        .btn-wa { background: #25D366; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-refresh { background: var(--gold); color: var(--navy); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .alert-red { color: #cc0000; font-weight: bold; background: #ffe6e6; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div>
        <h1 style="margin:0;">AlQaed | القائد</h1>
        <small>نظام الإدارة اللوجستية المتكامل - أبو خالد</small>
    </div>
    <button class="btn-refresh" onclick="fetchData()">تحديث البيانات 🔄</button>
</header>

<div class="container">
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>الكابتن</th>
                    <th>الأجرة (Agra)</th>
                    <th>المديونية الحاليّة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4" style="text-align:center;">جاري جلب البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // الرابط المحدث الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwoR0e0VpV8kfUpMcQiMbnKrm_ST8qV0T6w4RGiMt7M9G7F5OvlcZuYgeo79WbfbYDm/exec";

    async function fetchData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>⏳ جاري التحقق من المديونيات...</td></tr>";
        
        try {
            const response = await fetch(SCRIPT_URL + '?nocache=' + new Date().getTime());
            const data = await response.json();
            tbody.innerHTML = "";

            data.forEach(row => {
                const debt = parseFloat(row.debt) || 0;
                const statusClass = debt >= 15 ? "alert-red" : "";
                const msg = `إشعار من شركة القائد:\nالكابتن ${row.name}، نرجو تسوية مديونيتكم البالغة ${debt} دينار.`;
                const waLink = `https://wa.me/${row.phone}?text=${encodeURIComponent(msg)}`;

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${row.name}</strong></td>
                        <td>${row.price} JOD</td>
                        <td class="${statusClass}">${debt} دينار</td>
                        <td><a href="${waLink}" target="_blank" class="btn-wa">تنبيه واتساب ✅</a></td>
                    </tr>
                `;
            });
        } catch (e) {
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:red;'>خطأ في الاتصال. تأكد من إعدادات النشر (Anyone).</td></tr>";
        }
    }
    window.onload = fetchData;
</script>
</body>
</html>
