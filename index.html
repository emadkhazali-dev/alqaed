<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AlQaed Dashboard | نظام القائد</title>
    <style>
        :root { --navy: #001f3f; --gold: #D4AF37; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; }
        header { background: var(--navy); color: var(--gold); padding: 20px; border-bottom: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .card { background: white; margin: 20px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: right; border-bottom: 2px solid var(--navy); color: var(--navy); }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .btn-wa { background: #25D366; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .status-badge { background: #e1f5fe; color: #01579b; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        .val-for { color: green; font-weight: bold; } /* له */
        .val-against { color: red; font-weight: bold; } /* عليه */
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">نظام القائد الذكي</h1>
    <button onclick="fetchData()" style="padding:10px 20px; cursor:pointer; font-weight:bold;">تحديث البيانات 🔄</button>
</header>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>المستهلك</th>
                <th>المنتج (له)</th>
                <th>نص الطلب</th>
                <th>الأجرة (Agra)</th>
                <th>العمولة (عليه)</th>
                <th>الحالة</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="7" style="text-align:center;">جاري جلب البيانات...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJPNO59nVssOZz1nXnwTBBpVjUSnprNBp_E7gx-kt3VraeVMNNthjp8EaKuMjO2WBa/exec";

    async function fetchData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = "<tr><td colspan="7" style="text-align:center;">⏳ جاري التحديث...</td></tr>";
        try {
            const response = await fetch(SCRIPT_URL + '?nocache=' + new Date().getTime());
            const data = await response.json();
            tbody.innerHTML = "";
            data.forEach(row => {
                const waMsg = `إشعار شركة القائد:\nالمستهلك: ${row.name}\nالمنتج: ${row.product}\nالطلب: ${row.details}\nالعمولة: ${row.commission}`;
                const waLink = `https://wa.me/${row.phone}?text=${encodeURIComponent(waMsg)}`;
                
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${row.name}</strong></td>
                        <td class="val-for">${row.product}</td>
                        <td><small>${row.details}</small></td>
                        <td>${row.agra} JOD</td>
                        <td class="val-against">${row.commission}</td>
                        <td><span class="status-badge">${row.status || 'نشط'}</span></td>
                        <td><a href="${waLink}" class="btn-wa">واتساب ✅</a></td>
                    </tr>
                `;
            });
        } catch(e) { tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>فشل في جلب البيانات</td></tr>"; }
    }
    window.onload = fetchData;
</script>
</body>
</html>
