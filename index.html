<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlQaed Dashboard | نظام القائد الذكي</title>
    <style>
        :root { --navy: #001f3f; --gold: #D4AF37; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        header { background: var(--navy); color: var(--gold); padding: 20px; border-bottom: 5px solid var(--gold); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--white); border-radius: 12px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 600px; }
        th { background: var(--navy); color: var(--gold); padding: 15px; text-align: right; border-bottom: 2px solid var(--gold); }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: right; }
        .btn-wa { background: #25D366; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; display: inline-block; }
        .btn-refresh { background: var(--gold); color: var(--navy); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-refresh:hover { background: #b8962d; }
        .alert-red { color: #cc0000; font-weight: bold; background: #ffe6e6; padding: 5px; border-radius: 4px; }
        .safe-green { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div>
        <h1 style="margin:0;">AlQaed | القائد</h1>
        <small>نظام الإدارة اللوجستية المتكامل - أبو خالد</small>
    </div>
    <button class="btn-refresh" onclick="fetchData()">تحديث البيانات 🔄</button>
</header>

<div class="container">
    <div class="card">
        <h2 style="color: var(--navy); margin-top:0;">لوحة تحكم الكباتن (300 كابتن)</h2>
        <table id="captainsTable">
            <thead>
                <tr>
                    <th>الكابتن</th>
                    <th>الأجرة (Agra)</th>
                    <th>المديونية الحاليّة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4" style="text-align:center;">اضغط على "تحديث البيانات" لجلب المعلومات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // الرابط الخاص بك مدمج هنا يا أبو خالد
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzD-kOnHnig3wm2Fwa5Y7A9-DvtoJYBj80N2BXKZ2HcN3XTqrvtvGKRI-oeyE3k8Fng/exec";

    async function fetchData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>جاري سحب البيانات من نظام القائد...</td></tr>";
        
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>لا توجد بيانات حالياً في الجدول.</td></tr>";
                return;
            }

            data.forEach(row => {
                const debt = parseFloat(row.debt) || 0;
                const statusClass = debt >= 15 ? "alert-red" : "safe-green";
                const message = `إشعار من نظام القائد:\nالكابتن ${row.name}، نرجو تسوية مديونيتكم البالغة (${debt}) دينار.\nشكراً لك.`;
                const waLink = row.phone ? `https://wa.me/${row.phone.toString().replace(/\D/g,'')}?text=${encodeURIComponent(message)}` : "#";

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${row.name}</strong></td>
                        <td>${row.price || 0} JOD</td>
                        <td class="${statusClass}">${debt} دينار</td>
                        <td>
                            ${row.phone ? `<a href="${waLink}" target="_blank" class="btn-wa">تنبيه واتساب ✅</a>` : "<small>لا يوجد رقم</small>"}
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:red;'>⚠️ خطأ في الاتصال. تأكد من إدخال بيانات في الجدول ونشر السكربت كـ Anyone.</td></tr>";
        }
    }

    // جلب البيانات تلقائياً عند فتح الصفحة
    window.onload = fetchData;
</script>

</body>
</html>
